name: Build, Test and Publish TerminalCalculator

on:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Run Tests
        run: dotnet test TerminalCalculator.Tests

      - name: Prepare version number
        if: github.ref_type == 'tag'
        run: echo "Version=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Publish windows-x64
        if: github.ref_type == 'tag'
        run: dotnet publish TerminalCalculator -r win-x64 -p:PublishSingleFile=true  -p:AssemblyName=TerminalCalculator-Windows -p:Version=${{env.Version}} -o output-windows

      - name: Publish linux-x64
        if: github.ref_type == 'tag'
        run: dotnet publish TerminalCalculator -r linux-x64 -p:PublishSingleFile=true -p:AssemblyName=TerminalCalculator-Linux -p:Version=${{env.Version}} -o output-linux

      - name: Publish macOS-x64
        if: github.ref_type == 'tag'
        run: dotnet publish TerminalCalculator -r osx-x64 -p:PublishSingleFile=true -p:AssemblyName=TerminalCalculator-macOS -p:Version=${{env.Version}} -o output-macos

      - name: Save artifact Windows
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v5
        with:
          name: TerminalCalculator-Windows
          path: output-windows/

      - name: Save artifact linux
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v5
        with:
          name: TerminalCalculator-linux
          path: output-linux/

      - name: Save artifact macOS
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v5
        with:
          name: TerminalCalculator-macOS
          path: output-macos/

      - name: Publish Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{github.ref_name}}
          name: "TerminalCalculator Release ${{github.ref_name}}"
          files: |
            output-windows/TerminalCalculator-Windows.exe
            output-linux/TerminalCalculator-Linux
            output-macos/TerminalCalculator-macOS
