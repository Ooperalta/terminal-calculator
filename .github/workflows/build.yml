name: Build and Publish TerminalCalculator

on:
  push:
    branches: ["main"]
    permissions:
      contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@v5

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Publish windows-x64
        run: dotnet publish TerminalCalculator -r win-x64 -p:PublishSingleFile=true -o output-windows

      - name: Publish linux-x64
        run: dotnet publish TerminalCalculator -r linux-x64 -p:PublishSingleFile=true -o output-linux

      - name: Publish macOS-x64
        run: dotnet publish TerminalCalculator -r osx-x64 -p:PublishSingleFile=true -o output-macos

      - name: Save artifact Windows
        uses: actions/upload-artifact@v5
        with:
          name: TerminalCalculator-Windows
          path: output-windows/

      - name: Save artifact linux
        uses: actions/upload-artifact@v5
        with:
          name: TerminalCalculator-linux
          path: output-linux/

      - name: Save artifact macOS
        uses: actions/upload-artifact@v5
        with:
          name: TerminalCalculator-macOS
          path: output-macos/

      - name: Publish Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "latest"
          name: "TerminalCalculator Release"
          files: |
            output-windows/TerminalCalculator.exe
            output-linux/TerminalCalculator
            output-macos/TerminalCalculator
