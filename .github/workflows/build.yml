name: Build and Publish TerminalCalculator

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pull repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Publish windows-x64
        run: dotnet publish TerminalCalculator -r win-x64 -o output

      - name: Save artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerminalCalculator-Windows
          path: output/
